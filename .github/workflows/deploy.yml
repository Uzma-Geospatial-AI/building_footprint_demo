name: Deploy to EC2

# Every push to main publishes the site to the production server, served as static
# files by the host nginx at https://buildvision.uzmadigitalearth.app/ (no build
# step, no container). Manual runs via "Run workflow".
#
# Optional: set a DEMO_PASSWORD repository secret to rotate the demo password at
# deploy time instead of committing a new digest. If it is not set, the digest
# already in login.html is deployed unchanged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-buildvision
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Inject password digest
        env:
          # Read via env, never interpolated straight into the script body.
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "$DEMO_PASSWORD" ]; then
            echo "DEMO_PASSWORD not set — keeping the digest committed in login.html"
            exit 0
          fi

          SALT=$(grep -oP "(?<=const PASS_SALT = ')[^']*" login.html)
          HASH=$(printf '%s' "${SALT}${DEMO_PASSWORD}" | sha256sum | cut -d' ' -f1)

          # Replace the 64-hex digest in place. The password itself is never
          # written to disk or echoed to the log.
          sed -i -E "s/(const PASS_HASH = ')[0-9a-f]{64}(')/\1${HASH}\2/" login.html

          if ! grep -qE "const PASS_HASH = '${HASH}'" login.html; then
            echo "::error::Digest substitution failed — refusing to deploy a broken login"
            exit 1
          fi
          echo "Digest injected (${#HASH} hex chars)"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync site to the server
        # Only what the browser needs: repo tooling, docs and dotfiles stay behind.
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='docs' \
            --exclude='tools' \
            --exclude='__pycache__' \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/buildvision/"

      - name: Health check
        run: |
          for page in login.html index.html; do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://buildvision.uzmadigitalearth.app/$page")
            echo "$page -> HTTP $code"
            [ "$code" = "200" ] || exit 1
          done
